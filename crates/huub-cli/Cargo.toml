[package]
name = "huub-cli"
description = "CLI tool for the Huub CP+SAT solver framework"

authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
readme = "README.md"

# The published tarball is assumed to be consumed via `cargo install`, which
# only builds the executable. Benches and integration tests are expected to be
# run in-repo, so we exclude them to keep the published crate lean.
exclude = ["benches/", "corpus/", "tests/"]

[[bin]]
name = "huub"
path = "src/main.rs"

[[bench]]
name = "flatzinc_bench"
harness = false

[dependencies]
anstream = { workspace = true }
clap = { workspace = true }
ctrlc = { workspace = true }
flatzinc-serde = { workspace = true }
humantime = { workspace = true }
huub = { version = "100.0.0", path = "../huub", features = ["flatzinc"] }
mimalloc = { workspace = true }
rustc-hash = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
divan = { workspace = true }
expect-test = { workspace = true }

[lints]
workspace = true
