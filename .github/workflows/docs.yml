name: Build docs

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

env:
  RUST_CHANNEL: "stable"
  MDBOOK_VERSION: "0.4.52"

jobs:
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - name: Setup GitHub Pages
        if: github.event_name == 'push' && github.repository_owner == 'huub-solver' && github.ref == 'refs/heads/develop'
        uses: actions/configure-pages@v5
      - name: Install Rust toolchain
        uses: moonrepo/setup-rust@v1
        with:
          cache: false
          channel: ${{ env.RUST_CHANNEL }}
      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: ${{ env.MDBOOK_VERSION }}
      - name: Build Huub for mdBook tests
        run: cargo build -p huub
        working-directory: .
      - name: Run mdBook tests
        run: mdbook test --library-path ../target/debug/deps
      - name: Build mdBook site
        run: mdbook build
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.repository_owner == 'huub-solver' && github.ref == 'refs/heads/develop'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    if: github.event_name == 'push' && github.repository_owner == 'huub-solver' && github.ref == 'refs/heads/develop'
    needs: docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
