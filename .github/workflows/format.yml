name: Check Format

on:
  pull_request:
    branches-ignore: ["dependabot/**"]

env:
  # Lets us format with unstable rustfmt options
  RUST_CHANNEL: nightly

jobs:
  check_format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Check formatting of Rust files
      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal --component rustfmt --no-self-update ${{ env.RUST_CHANNEL }}
          rustup default ${{ env.RUST_CHANNEL }}
      - name: Run cargo format
        run: cargo +nightly fmt --all --check

      # Check that top-level items in each Rust file are in the project's
      # opinionated sort order (mod, use, const/static, types, fn, impl, ...).
      - name: Check item sort
        uses: Dekker1/rust-item-sort@v0
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_CHANNEL }}
